<!DOCTYPE html>
<!-- crome용 -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>녹음하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:#4C6FFF; --primary-dark:#3853D6;
    --teal:#14B8A6; --teal-dark:#0E9488;
    --amber:#F59E0B; --amber-dark:#C9790A;
    --red:#EF4444; --red-dark:#DC2626;
    --ink:#2E3440; --ink-light:#6B7280;
    --line:#E3E6ED;
    --surface:#FFFFFF;
    --bg:#F4F6FA;
    --font: 'Gothic A1', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font); background:var(--bg); margin:0; padding:20px; color:var(--ink); }

  @keyframes popIn {
    0% { opacity:0; transform: translateY(10px); }
    100% { opacity:1; transform: translateY(0); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity:0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity:0; }
  }

  .card { position:relative; max-width:480px; margin:0 auto; background:var(--surface); border-radius:16px; padding:24px;
          border:1px solid var(--line);
          box-shadow:0 4px 14px rgba(20,24,40,0.06);
          animation: popIn 0.3s ease-out; }

  .header-info { display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
  .class-badge { background:var(--primary); color:#fff; font-size:12px; font-weight:700;
                  padding:5px 12px; border-radius:999px; }
  .student-name-big { font-size:18px; font-family:var(--font); font-weight:700; color:var(--ink); }
  h1 { font-size:16px; margin:6px 0 12px; color:var(--ink); font-family:var(--font); font-weight:700; }
  .script-box { background:#F7F8FA; border:1px solid var(--line); border-radius:12px; padding:16px;
                margin-bottom:16px; font-size:17px; line-height:1.8; color:var(--ink); white-space:pre-wrap;
                font-family: var(--font); font-weight:500; }
  .hint { font-size:12px; color:var(--ink-light); margin-top:10px; text-align:center; }
  button { font-family: var(--font); border:none; border-radius:12px; padding:14px; font-size:16px;
           font-weight:700; cursor:pointer; width:100%; transition: transform .06s ease, box-shadow .06s ease, opacity .15s ease; }
  .btn-record { background:var(--teal); color:#fff; box-shadow:0 2px 6px rgba(20,184,166,0.35); }
  .btn-record:active { transform:translateY(1px); box-shadow:0 1px 3px rgba(20,184,166,0.35); }
  .btn-stop { background:var(--red); color:#fff; box-shadow:0 2px 6px rgba(239,68,68,0.35); }
  .btn-stop:active { transform:translateY(1px); box-shadow:0 1px 3px rgba(239,68,68,0.35); }
  .btn-submit { background:var(--primary); color:#fff; margin-top:8px; box-shadow:0 2px 6px rgba(76,111,255,0.35); }
  .btn-submit:active { transform:translateY(1px); box-shadow:0 1px 3px rgba(76,111,255,0.35); }
  .btn-redo2 { background:#fff; color:var(--ink); border:1px solid var(--line); margin-top:8px; }
  .btn-close { background:#fff; color:var(--ink); border:1px solid var(--line); margin-top:10px; }
  .status { text-align:center; font-size:15px; margin-top:14px; min-height:24px; }
  .timer { font-variant-numeric: tabular-nums; color:var(--ink-light); font-size:14px; text-align:center; margin-top:6px; }
  .banner { padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:14px; color:var(--ink); }
  .banner.error { background:#FDECEC; border-left:4px solid var(--red); }
  .banner.info { background:#EEF2FF; border-left:4px solid var(--primary); margin-top:12px; text-align:center; font-weight:700; }
  .result { text-align:center; margin-top:18px; font-size:18px; font-family:var(--font); font-weight:700; color:var(--ink); }
  .score-line { font-size:22px; color:var(--ink); margin:6px 0 2px; font-family:var(--font); font-weight:800; }
  audio { width:100%; margin-top:14px; }
  .back-link { display:inline-block; font-size:13px; color:var(--ink-light); cursor:pointer; font-weight:700;
                text-decoration:underline; text-underline-offset:2px; margin-bottom:12px; }
  .back-link.disabled { opacity:0.35; pointer-events:none; cursor:not-allowed; }
</style>
</head>
<body>
<div style="position:fixed; bottom:4px; right:6px; font-size:10px; color:#d1d5db; z-index:9999; pointer-events:none; user-select:none;">crome</div>
<div class="card">
  <span class="back-link" id="backBtn">← 이전 화면으로</span>
  <div class="header-info">
    <span class="class-badge" id="classBadge"></span>
    <span class="student-name-big" id="studentNameBig"></span>
  </div>
  <h1 id="titleLine">녹음하기</h1>
  <div class="script-box" id="scriptText"></div>

  <div id="controls">
    <button class="btn-record" id="recordBtn">🎙️ 녹음 시작</button>
  </div>
  <div class="timer" id="timerText"></div>
  <div class="status" id="statusText"></div>
  <div id="reviewArea"></div>
  <div id="resultArea"></div>
</div>

<script>
// ⚠️ Apps Script 웹앱 배포 URL로 반드시 교체하세요 (끝이 /exec 로 끝나는 그 주소).
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyoE90HietTg4sG3ODW5bSgG0D_PPj1Zxn3ShOVYfVDEhwGOIqYJRfsP5WFb3B3mD2A/exec';

const MAX_RECORD_SECONDS = 300; // 5분 안전장치

const params = new URLSearchParams(window.location.search);
const ctx = {
  studentId: params.get('studentId') || '',
  studentName: params.get('studentName') || '',
  className: params.get('className') || '',
  classId: params.get('classId') || '',
  assignmentId: params.get('assignmentId') || '',
  assignmentTitle: params.get('assignmentTitle') || '',
  attempt: params.get('attempt') || '1',
  script: params.get('script') || '',
  isRetry: params.get('isRetry') === '1'
};

document.getElementById('classBadge').textContent = ctx.className;
document.getElementById('studentNameBig').textContent = ctx.studentName;
document.getElementById('titleLine').textContent =
  ctx.attempt + (ctx.isRetry ? '번째 다시읽기 · ' : '번째 읽기 · ') + ctx.assignmentTitle;
document.getElementById('scriptText').textContent = ctx.script;

if (!ctx.studentId || !ctx.assignmentId || !ctx.script) {
  document.getElementById('controls').innerHTML =
    '<div class="banner error">필요한 정보가 없어요. 원래 숙제 화면에서 다시 시도해주세요.</div>';
}

// ---- 축하 컨페티(색종이) 효과 ----
function launchConfetti() {
  const colors = ['#4C6FFF', '#14B8A6', '#F59E0B', '#8B93A7', '#3853D6'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:2000; overflow:hidden;';
  document.body.appendChild(container);
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = 6 + Math.random() * 6;
    const left = Math.random() * 100;
    const duration = 1.8 + Math.random() * 1.4;
    const delay = Math.random() * 0.4;
    const rotate = Math.random() * 360;
    const shape = Math.random() > 0.5 ? '50%' : '3px';
    piece.style.cssText = `position:absolute; top:-20px; left:${left}%; width:${size}px; height:${size}px;
      background:${color}; border-radius:${shape};
      animation: confettiFall ${duration}s ease-in ${delay}s forwards; transform:rotate(${rotate}deg);`;
    container.appendChild(piece);
  }
  setTimeout(() => container.remove(), 3600);
}

let mediaRecorder, audioChunks = [];
let recordingTimer = null, autoStopTimer = null, recordSeconds = 0;
let isRecordingNow = false;
let recordedBlob = null;
// 이 페이지의 버튼(이전 화면으로/제출 후 닫기/다시 시도) 중 하나를 눌러서 "의도적으로" 나가는
// 경우엔 true로 바뀐다. false인 채로 페이지를 벗어나려 하면(=폰 뒤로가기, 스와이프, 탭 닫기 등
// 실수로 눌렸을 수 있는 경우) 아래 beforeunload가 브라우저 기본 확인창을 띄운다.
let leavingIntentionally = false;

window.addEventListener('beforeunload', (e) => {
  if (!leavingIntentionally) {
    e.preventDefault();
    e.returnValue = ''; // 최신 브라우저는 이 메시지를 무시하고 자체 문구("정말 나가시겠습니까?" 등)를 보여준다.
  }
});

// ---- 안전망: "이전 화면으로" 링크를 안 누르고 폰/브라우저 자체 뒤로가기나 스와이프로
// 이 창을 나가는 경우에도, 숙제 화면의 "다시 녹음하러 가기" 버튼이 계속 눌린 채로
// 남지 않도록 페이지가 실제로 사라지기 직전(pagehide)에 한 번 더 신호를 보낸다.
// (위 beforeunload 확인창에서 "머무르기"를 선택하면 pagehide 자체가 발생하지 않으므로 안전함.)
window.addEventListener('pagehide', () => {
  if (leavingIntentionally) return; // 이미 완료/취소 신호를 보냈거나 페이지 내 재시도(reload)면 중복 전송 안 함
  try {
    if (window.opener) window.opener.postMessage({ type: 'readingHwRecordingCancelled' }, '*');
  } catch (e) {}
});

const recordBtn = document.getElementById('recordBtn');
const controls = document.getElementById('controls');
const timerText = document.getElementById('timerText');
const statusText = document.getElementById('statusText');
const reviewArea = document.getElementById('reviewArea');
const resultArea = document.getElementById('resultArea');

recordBtn.addEventListener('click', startRecording);

// ---- 녹음 없이 이전 화면(숙제 화면)으로 돌아가기 ----
// 녹음을 시작하기 전까지만 쓸 수 있고(녹음이 시작되면 disabled 처리, 아래 startRecording 참고),
// 일단 녹음이 시작되면 제출을 마쳐야만 나갈 수 있다.
// 이 페이지는 숙제 화면에서 window.open()으로 열린 새 창/탭이라, 닫으면 원래 숙제 화면으로
// 자연스럽게 돌아간다. 그런데 숙제 화면 쪽 "다시 녹음하러 가기" 버튼이 focus 이벤트만 믿고
// 있으면(모바일 브라우저에서는 focus가 늦게 오거나 아예 안 올 수 있음) 몇 분씩 비활성 상태로
// 남아있을 수 있어서, postMessage로 즉시 알려줘서 바로 다시 활성화되게 한다.
const backBtn = document.getElementById('backBtn');
backBtn.addEventListener('click', () => {
  try {
    if (window.opener) window.opener.postMessage({ type: 'readingHwRecordingCancelled' }, '*');
  } catch (e) {}
  leavingIntentionally = true;
  if (window.opener) {
    window.close();
  } else {
    history.back();
  }
});

// ---- 폰/브라우저의 "뒤로가기"를 가로채서 확인창을 띄우기 위한 트릭 ----
// beforeunload는 안드로이드 하드웨어/제스처 뒤로가기에서는 브라우저가 그냥 무시하고
// 바로 페이지를 떠나버리는 경우가 많아 믿을 수 없다(이번에 실제로 그랬던 경우).
// 대신 History API로 더미 상태를 하나 쌓아두면, 뒤로가기를 눌렀을 때 곧바로 창이
// 닫히는 대신 popstate 이벤트가 먼저 발생해서 그 시점에 직접 확인창을 띄울 수 있다.
// (opener가 있는 정상 흐름에서만 건다 — opener가 없으면 위 history.back() 폴백 자체가
// 유일한 이탈 수단이라 트랩을 걸면 안 됨.)
if (window.opener) {
  history.pushState({ recorderGuard: true }, '', location.href);
  window.addEventListener('popstate', () => {
    if (leavingIntentionally) return;
    if (backBtn.classList.contains('disabled')) {
      // 녹음 시작~제출 전: "이전 화면으로" 링크와 동일하게 뒤로가기도 막고 안내만 한다
      alert('녹음을 시작하면 제출을 마쳐야 나갈 수 있어요.');
      history.pushState({ recorderGuard: true }, '', location.href);
      return;
    }
    const reallyLeave = confirm('녹음 화면을 나가시겠어요?');
    if (reallyLeave) {
      try {
        window.opener.postMessage({ type: 'readingHwRecordingCancelled' }, '*');
      } catch (e) {}
      leavingIntentionally = true;
      window.close();
    } else {
      history.pushState({ recorderGuard: true }, '', location.href); // 다시 트랩을 걸어둔다
    }
  });
}

function startRecording() {
  audioChunks = [];
  statusText.textContent = '';
  reviewArea.innerHTML = '';
  resultArea.innerHTML = '';
  // 일단 녹음을 시도하는 순간부터는 제출을 마쳐야 나갈 수 있도록 잠근다
  // (마이크 권한이 거부되면 아래 .catch()에서 다시 풀어준다).
  backBtn.classList.add('disabled');

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      isRecordingNow = false;
      clearTimeout(autoStopTimer);
      clearInterval(recordingTimer);
      timerText.textContent = '';
      showReviewStep();
    };
    mediaRecorder.start();
    isRecordingNow = true;

    // 브라우저 내장 음성인식(webkitSpeechRecognition)은 여기서 쓰지 않는다.
    // 서버 파라미터로 전혀 조정이 안 되고 문법/문맥 보정이 심해서, "발음을 있는 그대로" 채점한다는
    // 목적에 맞지 않기 때문. 인식은 항상 서버(Groq Whisper, Code.js)에서 처리한다.

    controls.innerHTML = '<button class="btn-stop" id="stopBtn">⏹ 녹음 종료</button>';
    document.getElementById('stopBtn').addEventListener('click', stopRecording);
    statusText.textContent = '🔴 녹음 중...';

    autoStopTimer = setTimeout(() => { stopRecording(); }, MAX_RECORD_SECONDS * 1000);

    recordSeconds = 0;
    recordingTimer = setInterval(() => {
      recordSeconds++;
      const mm = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
      const ss = String(recordSeconds % 60).padStart(2, '0');
      timerText.textContent = mm + ':' + ss;
    }, 1000);
  }).catch(() => {
    backBtn.classList.remove('disabled'); // 녹음이 실제로 시작되지 못했으니 다시 나갈 수 있게 풀어준다
    statusText.innerHTML = '<div class="banner error">마이크 접근이 거부되었습니다. 브라우저 마이크 권한을 허용한 뒤 다시 시도해주세요.</div>';
  });
}

// 실패/문제 상황에서 "다시 녹음하기"로 이 페이지 자체를 새로고침할 때 쓴다.
// 페이지를 벗어나는 게 아니라 같은 화면을 다시 시작하는 것뿐이라, beforeunload
// 확인창이나 pagehide의 "취소" 신호가 뜨지 않도록 미리 leavingIntentionally를 켠다.
function retryReload() {
  leavingIntentionally = true;
  location.reload();
}

function stopRecording() {
  clearInterval(recordingTimer);
  clearTimeout(autoStopTimer);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

// ---- 녹음 종료 후: 들어보고 제출 여부 결정 ----
function showReviewStep() {
  recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });

  if (recordedBlob.size < 2000) {
    statusText.innerHTML = '<div class="banner error">녹음에 문제가 있어요. 다시 녹음해주세요.</div>';
    controls.innerHTML = '<button class="btn-record" onclick="retryReload()">다시 녹음하기</button>';
    return;
  }

  statusText.textContent = '';
  controls.innerHTML = '';
  const audioUrl = URL.createObjectURL(recordedBlob);
  reviewArea.innerHTML = `
    <audio controls src="${audioUrl}"></audio>
    <p class="hint" style="margin-top:10px;">녹음을 들어본 뒤 제출해주세요. 마음에 안 들면 다시 녹음할 수 있어요.</p>
    <button class="btn-submit" id="submitBtn">✅ 제출하기</button>
    <button class="btn-redo2" id="redoBtn">🔄 다시 녹음하기</button>
  `;
  document.getElementById('submitBtn').addEventListener('click', submitRecordingNow);
  document.getElementById('redoBtn').addEventListener('click', () => {
    reviewArea.innerHTML = '';
    recordedBlob = null;
    controls.innerHTML = '<button class="btn-record" id="recordBtn">🎙️ 녹음 시작</button>';
    document.getElementById('recordBtn').addEventListener('click', startRecording);
  });
}

function submitRecordingNow() {
  reviewArea.innerHTML = '';
  statusText.textContent = '확인 중...';

  const reader = new FileReader();
  reader.onloadend = () => {
    const base64Data = reader.result.split(',')[1];

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS 프리플라이트 회피
      body: JSON.stringify({
        action: 'submitRecording',
        payload: {
          studentId: ctx.studentId,
          studentName: ctx.studentName,
          classId: ctx.classId,
          assignmentId: ctx.assignmentId,
          attemptNumber: Number(ctx.attempt),
          mimeType: 'audio/webm',
          base64Data: base64Data
        }
      })
    })
      .then(res => res.json())
      .then(res => {
        statusText.textContent = '';
        if (!res.success) {
          resultArea.innerHTML = '<div class="banner error">' + res.message + '</div>' +
            '<button class="btn-record" onclick="retryReload()">다시 녹음하기</button>';
          return;
        }
        const gradeText = {
          'Good': '😃 참 잘 읽었어요',
          'Normal': '🙂 잘 읽었어요',
          'Practice': '🤔 다시 한번 읽어볼까요'
        }[res.grade] || (res.retryPending ? '나중에 등급이 확인되면 표시돼요' : '등급 확인 실패');
        const scoreLine = (res.score === null || res.score === undefined) ? '' :
          '<div class="score-line">' + res.score + '점 / 100</div>';

        resultArea.innerHTML =
          '<div class="result">✅ 제출 완료!' + scoreLine + '<div>' + gradeText + '</div></div>' +
          '<div class="banner info">다시 녹음하거나 다음 번째 읽기를 하려면<br>이 창을 닫고 원래 화면으로 돌아가주세요.</div>' +
          '<button class="btn-close" id="closeBtn">이 창 닫고 돌아가기</button>';
        backBtn.style.display = 'none'; // 제출 완료 후에는 위 닫기 버튼이 그 역할을 대신함

        if (res.grade === 'Good') launchConfetti();
        notifyOpenerAndMaybeClose();
      })
      .catch(() => {
        statusText.textContent = '';
        resultArea.innerHTML = '<div class="banner error">업로드에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.</div>' +
          '<button class="btn-record" onclick="retryReload()">다시 녹음하기</button>';
      });
  };
  reader.readAsDataURL(recordedBlob);
}

function notifyOpenerAndMaybeClose() {
  try {
    if (window.opener) {
      window.opener.postMessage({ type: 'readingHwRecordingComplete' }, '*');
    }
  } catch (e) {}
  leavingIntentionally = true;

  const closeBtn = document.getElementById('closeBtn');
  if (closeBtn) {
    closeBtn.addEventListener('click', () => { window.close(); });
  }
}
</script>
</body>
</html>
