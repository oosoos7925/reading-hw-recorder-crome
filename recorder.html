<!DOCTYPE html>
<!-- crome용 -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>녹음하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink:#FF7EB3; --pink-dark:#E8558F;
    --purple:#B39DFF; --purple-dark:#9270E8;
    --mint:#4ADE9C; --mint-dark:#22B573;
    --sky:#7DD3FC; --sky-dark:#2AA8E0;
    --peach:#FFB86B; --peach-dark:#F0933A;
    --coral:#FF6B6B; --coral-dark:#E24545;
    --choco:#8B7160; --choco-light:#C4B3A6;
    --cream:#FFFDF7;
    --font-heading: 'Jua', 'Malgun Gothic', sans-serif;
    --font-body: 'Gowun Dodum', 'Malgun Gothic', sans-serif;
    --font-script: 'Baloo 2', 'Gowun Dodum', 'Malgun Gothic', sans-serif; /* 영어 읽기 대본 전용: 또렷한 글자 구분이 중요 */
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font-body); background:linear-gradient(180deg, #FDF4FF 0%, #F0FBFF 100%);
         background-attachment:fixed; margin:0; padding:20px; color:var(--choco); }

  @keyframes popIn {
    0% { opacity:0; transform: translateY(16px) scale(0.94); }
    60% { opacity:1; transform: translateY(-4px) scale(1.02); }
    100% { opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity:0.95; }
    100% { transform: translateY(110vh) rotate(360deg); opacity:0; }
  }

  .card { position:relative; max-width:480px; margin:0 auto; background:var(--cream); border-radius:24px; padding:26px 24px;
          border:3px solid #FFE1EE;
          box-shadow:0 10px 24px rgba(255,126,179,0.18), 0 2px 6px rgba(139,113,96,0.08);
          animation: popIn 0.45s cubic-bezier(.34,1.56,.64,1); }
  .card::before { content:'🎙️'; position:absolute; top:-18px; left:24px; font-size:30px; transform:rotate(-10deg); }

  .header-info { display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
  .class-badge { background:var(--purple); color:#fff; font-size:12px; font-weight:700; font-family:var(--font-heading);
                  padding:5px 12px; border-radius:999px; }
  .student-name-big { font-size:19px; font-family:var(--font-heading); color:var(--choco); }
  h1 { font-size:17px; margin:6px 0 12px; color:var(--purple-dark); font-family:var(--font-heading); font-weight:400; }
  .script-box { background:#FFF8EF; border:2px dashed #F3D9E8; border-radius:16px; padding:16px;
                margin-bottom:16px; font-size:17px; line-height:1.8; color:var(--choco); white-space:pre-wrap;
                font-family: var(--font-script); font-weight:500; }
  .hint { font-size:12px; color:var(--choco-light); margin-top:10px; text-align:center; }
  button { font-family: var(--font-heading); border:none; border-radius:999px; padding:14px; font-size:17px;
           font-weight:400; cursor:pointer; width:100%; transition: transform .08s ease, box-shadow .08s ease, opacity .15s ease; }
  .btn-record { background:var(--mint); color:#fff; box-shadow:0 4px 0 var(--mint-dark); }
  .btn-record:active { transform:translateY(4px); box-shadow:0 0 0 var(--mint-dark); }
  .btn-stop { background:var(--coral); color:#fff; box-shadow:0 4px 0 var(--coral-dark); }
  .btn-stop:active { transform:translateY(4px); box-shadow:0 0 0 var(--coral-dark); }
  .btn-submit { background:var(--pink); color:#fff; margin-top:8px; box-shadow:0 4px 0 var(--pink-dark); }
  .btn-submit:active { transform:translateY(4px); box-shadow:0 0 0 var(--pink-dark); }
  .btn-redo2 { background:#fff; color:var(--purple-dark); border:2px solid #E3D6FF; margin-top:8px; }
  .btn-close { background:#fff; color:var(--choco); border:2px solid #F3D9E8; margin-top:10px; }
  .status { text-align:center; font-size:15px; margin-top:14px; min-height:24px; }
  .timer { font-variant-numeric: tabular-nums; color:var(--choco-light); font-size:14px; text-align:center; margin-top:6px; }
  .banner { padding:10px 12px; border-radius:14px; font-size:13px; margin-bottom:14px; }
  .banner.error { background:#FFE9E9; color:var(--coral-dark); }
  .banner.info { background:#E9F7FF; color:var(--sky-dark); margin-top:12px; text-align:center; font-weight:700; }
  .result { text-align:center; margin-top:18px; font-size:18px; font-family:var(--font-heading); }
  .score-line { font-size:24px; color:var(--pink-dark); margin:6px 0 2px; font-family:var(--font-heading); }
  .star-row { margin:6px 0 2px; }
  .star { font-size:20px; opacity:0.25; filter:grayscale(1); margin:0 1px; }
  .star.filled { opacity:1; filter:none; }
  audio { width:100%; margin-top:14px; }
</style>
</head>
<body>
<div style="position:fixed; bottom:4px; right:6px; font-size:10px; color:#d1d5db; z-index:9999; pointer-events:none; user-select:none;">crome</div>
<div class="card">
  <div class="header-info">
    <span class="class-badge" id="classBadge"></span>
    <span class="student-name-big" id="studentNameBig"></span>
  </div>
  <h1 id="titleLine">녹음하기</h1>
  <div class="script-box" id="scriptText"></div>

  <div id="controls">
    <button class="btn-record" id="recordBtn">🎙️ 녹음 시작</button>
  </div>
  <div class="timer" id="timerText"></div>
  <div class="status" id="statusText"></div>
  <div id="reviewArea"></div>
  <div id="resultArea"></div>
</div>

<script>
// ⚠️ Apps Script 웹앱 배포 URL로 반드시 교체하세요 (끝이 /exec 로 끝나는 그 주소).
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyoE90HietTg4sG3ODW5bSgG0D_PPj1Zxn3ShOVYfVDEhwGOIqYJRfsP5WFb3B3mD2A/exec';

const MAX_RECORD_SECONDS = 300; // 5분 안전장치

const params = new URLSearchParams(window.location.search);
const ctx = {
  studentId: params.get('studentId') || '',
  studentName: params.get('studentName') || '',
  className: params.get('className') || '',
  classId: params.get('classId') || '',
  assignmentId: params.get('assignmentId') || '',
  assignmentTitle: params.get('assignmentTitle') || '',
  attempt: params.get('attempt') || '1',
  script: params.get('script') || '',
  isRetry: params.get('isRetry') === '1'
};

document.getElementById('classBadge').textContent = ctx.className;
document.getElementById('studentNameBig').textContent = ctx.studentName;
document.getElementById('titleLine').textContent =
  ctx.attempt + (ctx.isRetry ? '번째 다시읽기 · ' : '번째 읽기 · ') + ctx.assignmentTitle;
document.getElementById('scriptText').textContent = ctx.script;

if (!ctx.studentId || !ctx.assignmentId || !ctx.script) {
  document.getElementById('controls').innerHTML =
    '<div class="banner error">필요한 정보가 없어요. 원래 숙제 화면에서 다시 시도해주세요.</div>';
}

function starsHtml(n) {
  let out = '<div class="star-row">';
  for (let i = 0; i < 3; i++) out += `<span class="star${i < n ? ' filled' : ''}">⭐</span>`;
  return out + '</div>';
}

// ---- 축하 컨페티(색종이) 효과 ----
function launchConfetti() {
  const colors = ['#FF7EB3', '#B39DFF', '#4ADE9C', '#7DD3FC', '#FFB86B'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:2000; overflow:hidden;';
  document.body.appendChild(container);
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = 6 + Math.random() * 6;
    const left = Math.random() * 100;
    const duration = 1.8 + Math.random() * 1.4;
    const delay = Math.random() * 0.4;
    const rotate = Math.random() * 360;
    const shape = Math.random() > 0.5 ? '50%' : '3px';
    piece.style.cssText = `position:absolute; top:-20px; left:${left}%; width:${size}px; height:${size}px;
      background:${color}; border-radius:${shape};
      animation: confettiFall ${duration}s ease-in ${delay}s forwards; transform:rotate(${rotate}deg);`;
    container.appendChild(piece);
  }
  setTimeout(() => container.remove(), 3600);
}

let mediaRecorder, audioChunks = [];
let recordingTimer = null, autoStopTimer = null, recordSeconds = 0;
let isRecordingNow = false;
let recordedBlob = null;

window.addEventListener('beforeunload', (e) => {
  if (isRecordingNow) {
    e.preventDefault();
    e.returnValue = '';
  }
});

const recordBtn = document.getElementById('recordBtn');
const controls = document.getElementById('controls');
const timerText = document.getElementById('timerText');
const statusText = document.getElementById('statusText');
const reviewArea = document.getElementById('reviewArea');
const resultArea = document.getElementById('resultArea');

recordBtn.addEventListener('click', startRecording);

function startRecording() {
  audioChunks = [];
  statusText.textContent = '';
  reviewArea.innerHTML = '';
  resultArea.innerHTML = '';

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      isRecordingNow = false;
      clearTimeout(autoStopTimer);
      clearInterval(recordingTimer);
      timerText.textContent = '';
      showReviewStep();
    };
    mediaRecorder.start();
    isRecordingNow = true;

    // 브라우저 내장 음성인식(webkitSpeechRecognition)은 여기서 쓰지 않는다.
    // 서버 파라미터로 전혀 조정이 안 되고 문법/문맥 보정이 심해서, "발음을 있는 그대로" 채점한다는
    // 목적에 맞지 않기 때문. 인식은 항상 서버(Groq Whisper, Code.js)에서 처리한다.

    controls.innerHTML = '<button class="btn-stop" id="stopBtn">⏹ 녹음 종료</button>';
    document.getElementById('stopBtn').addEventListener('click', stopRecording);
    statusText.textContent = '🔴 녹음 중...';

    autoStopTimer = setTimeout(() => { stopRecording(); }, MAX_RECORD_SECONDS * 1000);

    recordSeconds = 0;
    recordingTimer = setInterval(() => {
      recordSeconds++;
      const mm = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
      const ss = String(recordSeconds % 60).padStart(2, '0');
      timerText.textContent = mm + ':' + ss;
    }, 1000);
  }).catch(() => {
    statusText.innerHTML = '<div class="banner error">마이크 접근이 거부되었습니다. 브라우저 마이크 권한을 허용한 뒤 다시 시도해주세요.</div>';
  });
}

function stopRecording() {
  clearInterval(recordingTimer);
  clearTimeout(autoStopTimer);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

// ---- 녹음 종료 후: 들어보고 제출 여부 결정 ----
function showReviewStep() {
  recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });

  if (recordedBlob.size < 2000) {
    statusText.innerHTML = '<div class="banner error">녹음에 문제가 있어요. 다시 녹음해주세요.</div>';
    controls.innerHTML = '<button class="btn-record" onclick="location.reload()">다시 녹음하기</button>';
    return;
  }

  statusText.textContent = '';
  controls.innerHTML = '';
  const audioUrl = URL.createObjectURL(recordedBlob);
  reviewArea.innerHTML = `
    <audio controls src="${audioUrl}"></audio>
    <p class="hint" style="margin-top:10px;">녹음을 들어본 뒤 제출해주세요. 마음에 안 들면 다시 녹음할 수 있어요.</p>
    <button class="btn-submit" id="submitBtn">✅ 제출하기</button>
    <button class="btn-redo2" id="redoBtn">🔄 다시 녹음하기</button>
  `;
  document.getElementById('submitBtn').addEventListener('click', submitRecordingNow);
  document.getElementById('redoBtn').addEventListener('click', () => {
    reviewArea.innerHTML = '';
    recordedBlob = null;
    controls.innerHTML = '<button class="btn-record" id="recordBtn">🎙️ 녹음 시작</button>';
    document.getElementById('recordBtn').addEventListener('click', startRecording);
  });
}

function submitRecordingNow() {
  reviewArea.innerHTML = '';
  statusText.textContent = '확인 중...';

  const reader = new FileReader();
  reader.onloadend = () => {
    const base64Data = reader.result.split(',')[1];

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS 프리플라이트 회피
      body: JSON.stringify({
        action: 'submitRecording',
        payload: {
          studentId: ctx.studentId,
          studentName: ctx.studentName,
          classId: ctx.classId,
          assignmentId: ctx.assignmentId,
          attemptNumber: Number(ctx.attempt),
          mimeType: 'audio/webm',
          base64Data: base64Data
        }
      })
    })
      .then(res => res.json())
      .then(res => {
        statusText.textContent = '';
        if (!res.success) {
          resultArea.innerHTML = '<div class="banner error">' + res.message + '</div>' +
            '<button class="btn-record" onclick="location.reload()">다시 녹음하기</button>';
          return;
        }
        const gradeText = {
          'Good': '😃 참 잘 읽었어요',
          'Normal': '🙂 잘 읽었어요',
          'Practice': '🤔 다시 한번 읽어볼까요'
        }[res.grade] || (res.retryPending ? '나중에 등급이 확인되면 표시돼요' : '등급 확인 실패');
        const scoreLine = (res.score === null || res.score === undefined) ? '' :
          '<div class="score-line">' + res.score + '점 / 100</div>';
        const gradeStars = { 'Good': 3, 'Normal': 2, 'Practice': 1 }[res.grade];
        const starsLine = gradeStars ? starsHtml(gradeStars) : '';

        resultArea.innerHTML =
          '<div class="result">✅ 제출 완료!' + scoreLine + starsLine + '<div>' + gradeText + '</div></div>' +
          '<div class="banner info">다시 녹음하거나 다음 번째 읽기를 하려면<br>이 창을 닫고 원래 화면으로 돌아가주세요.</div>' +
          '<button class="btn-close" id="closeBtn">이 창 닫고 돌아가기</button>';

        if (res.grade === 'Good') launchConfetti();
        notifyOpenerAndMaybeClose();
      })
      .catch(() => {
        statusText.textContent = '';
        resultArea.innerHTML = '<div class="banner error">업로드에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.</div>' +
          '<button class="btn-record" onclick="location.reload()">다시 녹음하기</button>';
      });
  };
  reader.readAsDataURL(recordedBlob);
}

function notifyOpenerAndMaybeClose() {
  try {
    if (window.opener) {
      window.opener.postMessage({ type: 'readingHwRecordingComplete' }, '*');
    }
  } catch (e) {}

  const closeBtn = document.getElementById('closeBtn');
  if (closeBtn) {
    closeBtn.addEventListener('click', () => { window.close(); });
  }
}
</script>
</body>
</html>
