<!DOCTYPE html>
<!-- crome용 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>영어 읽기 숙제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:#4C6FFF; --primary-dark:#3853D6;
    --teal:#14B8A6; --teal-dark:#0E9488;
    --amber:#F59E0B; --amber-dark:#C9790A;
    --red:#EF4444; --red-dark:#DC2626;
    --ink:#2E3440; --ink-light:#6B7280;
    --line:#E3E6ED;
    --surface:#FFFFFF;
    --bg:#F4F6FA;
    --font: 'Gothic A1', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100% !important;
    min-width: 100% !important;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%; /* 크롬 폰트 자동 확대/축소 방지 */
  }
  body { font-family: var(--font); background:var(--bg); margin:0; padding:20px; font-size:16px; color:var(--ink); }

  @keyframes popIn {
    0% { opacity:0; transform: translateY(10px); }
    100% { opacity:1; transform: translateY(0); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity:0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity:0; }
  }

  .card { position:relative; max-width:520px; margin:0 auto; background:var(--surface); border-radius:16px; padding:24px;
          box-sizing: border-box; border:1px solid var(--line);
          box-shadow:0 4px 14px rgba(20,24,40,0.06); }
  .card.pop-in { animation: popIn 0.3s ease-out; }

  h1 { font-family: var(--font); font-weight:700; font-size:20px; margin:0 0 14px; color:var(--ink); }
  input[type=text] { width:100%; padding:12px 14px; font-size:16px; font-family:var(--font); border-radius:10px;
                      border:1px solid var(--line); background:#fff; color:var(--ink); }
  input[type=text]:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(76,111,255,0.15); }
  .row-flex { display:flex; gap:8px; margin-top:10px; }
  .row-flex input { flex:1; }

  button { font-family: var(--font); font-weight:700; transition: transform .06s ease, box-shadow .06s ease, opacity .15s ease; }
  button.primary { background:var(--primary); color:#fff; border:none; border-radius:12px; padding:14px 18px;
                    font-size:16px; cursor:pointer; white-space:nowrap; min-height:48px;
                    box-shadow:0 2px 6px rgba(76,111,255,0.35); }
  button.primary:active:not(:disabled) { transform:translateY(1px); box-shadow:0 1px 3px rgba(76,111,255,0.35); }
  button.primary:disabled { background:#C7CCD6; color:#fff; box-shadow:none; cursor:not-allowed; }
  .radio-list { margin-top:12px; }
  .radio-item { display:flex; align-items:center; gap:8px; padding:12px; border:1px solid var(--line);
                border-radius:10px; margin-top:6px; cursor:pointer; font-size:15px; background:#fff; }
  .radio-item input { width:auto; }
  .msg { margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; color:var(--ink); }
  .msg.error { background:#FDECEC; border-left:4px solid var(--red); }
  .msg.info { background:#EEF2FF; border-left:4px solid var(--primary); }

  .header-info { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .class-badge { background:var(--primary); color:#fff; font-size:13px; font-weight:700;
                  padding:5px 12px; border-radius:999px; white-space:nowrap; }
  .student-name-big { font-family: var(--font); font-weight:700; font-size:20px; color:var(--ink); }
  .history-link { text-align:right; font-size:13px; color:var(--ink-light); cursor:pointer;
                   margin-bottom:6px; font-weight:700; text-decoration:underline; text-underline-offset:2px; }

  .retry-banner { background:#FFF7E8; color:var(--ink); border-left:4px solid var(--amber); border-radius:10px;
                   padding:10px 14px; font-weight:700; font-size:14px; margin:18px 0 10px; }

  .script-box { background:#F7F8FA; border:1px solid var(--line); border-radius:12px; padding:16px;
                margin-top:10px; font-size:18px; line-height:1.85; color:var(--ink); white-space:pre-wrap;
                font-family: var(--font); font-weight:500; }
  .hint { font-size:12px; color:var(--ink-light); margin-top:14px; text-align:center; }

  .info-box { background:#EEF2FF; border-radius:12px; padding:12px 14px; margin:14px 0; }
  .info-line { display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--ink); line-height:1.6; }
  .info-line + .info-line { margin-top:8px; }
  .info-icon { flex-shrink:0; font-size:15px; }

  .attempt { position:relative; padding:14px; border:1px solid var(--line); border-radius:12px; margin-top:10px; background:#fff; }
  .attempt.locked { background:#F5F6F8; opacity:0.6; }
  .attempt-top { display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .attempt-actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-start; width:100%; }
  .attempt-label { font-family:var(--font); font-weight:700; font-size:15px; color:var(--ink); white-space:nowrap; }
  .status-txt { font-size:13px; color:var(--ink-light); margin-top:6px; line-height:1.5; }
  button.btn-go { background:var(--teal); color:#fff; border:none; border-radius:10px;
                   padding:10px 16px; font-size:13px; cursor:pointer; min-height:40px;
                   box-shadow:0 2px 6px rgba(20,184,166,0.35); }
  button.btn-go:active { transform:translateY(1px); box-shadow:0 1px 3px rgba(20,184,166,0.35); }
  button.btn-locked { background:#E3E6ED; color:#9AA1AE; border:none; border-radius:10px;
                       padding:10px 16px; font-size:13px; cursor:not-allowed; }
  button.btn-redo { background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:10px;
                     padding:7px 12px; font-size:12px; cursor:pointer; }
  button.btn-play { background:#EEF2FF; color:var(--ink); border:1px solid #D7DEFF; border-radius:10px;
                     padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; }
  .audio-holder { margin-top:8px; }
  .audio-holder audio { width:100%; display:block; }
  .waiting-banner { margin-top:16px; padding:12px 14px; border-radius:10px; font-size:14px;
                     text-align:center; background:#EEF2FF; color:var(--ink); border-left:4px solid var(--primary); }
  .done-banner { margin-top:16px; padding:16px 14px; border-radius:12px; font-size:16px; font-weight:700;
                  text-align:center; background:#EAFBF6; color:var(--ink); border-left:4px solid var(--teal); }

  .history-item { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:10px; background:#fff; }
  .history-item h3 { font-family:var(--font); margin:0 0 6px; font-size:15px; color:var(--ink); font-weight:700; }
  .history-attempt { font-size:13px; color:var(--ink-light); padding:4px 0; border-top:1px dashed var(--line); }
  .history-attempt:first-child { border-top:none; }
  button.btn-gray-full { background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:10px;
                          padding:12px 16px; font-size:14px; width:100%; margin-top:16px; cursor:pointer; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(30,32,40,0.4); z-index:1000;
                    align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal-overlay .card { width:100%; }
  .modal-overlay.open .card { animation: popIn 0.25s ease-out; }
</style>
</head>
<body>
<div style="position:fixed; bottom:4px; right:6px; font-size:10px; color:#d1d5db; z-index:9999; pointer-events:none; user-select:none;">crome</div>
<div class="card" id="loginCard">
  <h1>📖 영어 읽기 숙제</h1>
  <input type="text" id="nameInput" placeholder="이름을 입력하세요" autocomplete="off">
  <div class="row-flex">
    <button class="primary" id="goBtn" style="width:100%;">숙제하기로 이동</button>
  </div>
  <div id="classChoiceArea" style="display:none;">
    <p class="msg info" id="dupMsg"></p>
    <div class="radio-list" id="classRadios"></div>
    <div class="row-flex">
      <button class="primary" id="confirmClassBtn" style="width:100%;">확인</button>
    </div>
  </div>
  <div id="passwordArea" style="display:none;">
    <p class="msg info" id="pwMsg">암호를 입력해주세요. (처음이면 1111)</p>
    <input type="text" id="passwordInput" placeholder="암호" autocomplete="off">
    <div class="row-flex">
      <button class="primary" id="confirmPasswordBtn" style="width:100%;">입장하기</button>
    </div>
  </div>
  <div id="loginMsg"></div>
</div>

<div class="card" id="homeworkCard" style="display:none;">
  <div style="display:flex; justify-content:flex-end; gap:16px; margin-bottom:6px;">
    <span class="history-link" id="pwChangeBtn" style="margin-bottom:0;">🔑 암호 변경</span>
    <span class="history-link" id="historyLinkBtn" style="margin-bottom:0;">📋 지난 숙제 기록 보기</span>
  </div>
  <div class="header-info">
    <span class="class-badge" id="classBadge"></span>
    <span class="student-name-big" id="studentNameBig"></span>
  </div>

  <div id="mainAssignmentBlock">
    <h1 id="assignmentTitleLabel">숙제</h1>
    <div class="script-box" id="scriptText"></div>
    <div class="info-box">
      <div class="info-line"><span class="info-icon">🎙️</span><span>녹음 버튼을 누르면 새 창이 열리고, 녹음을 마치면 이 화면이 자동으로 업데이트돼요.</span></div>
      <div class="info-line"><span class="info-icon">⚠️</span><span>마이크 권한 요청 팝업이 뜨면 반드시 "허용"을 눌러야 녹음할 수 있어요.</span></div>
    </div>
    <div id="attemptsArea"></div>
  </div>

  <div id="retryAssignmentBlock" style="display:none;">
    <div class="retry-banner">🔁 다시 읽어야 할 단원이 있어요</div>
    <h1 id="retryAssignmentTitleLabel">다시 읽기</h1>
    <div class="script-box" id="retryScriptText"></div>
    <div id="retryAttemptsArea"></div>
  </div>

  <div id="waitingBanner"></div>
  <div id="allDoneArea"></div>
</div>

<div class="card" id="historyCard" style="display:none;">
  <h1>📋 지난 숙제 기록</h1>
  <div id="historyList"></div>
  <button class="btn-gray-full" id="backFromHistoryBtn">돌아가기</button>
</div>

<div class="modal-overlay" id="pwModalOverlay">
  <div class="card" style="max-width:380px;">
    <h1>🔑 암호 변경</h1>
    <div id="pwModalFields">
      <input type="text" id="pwModalNew" placeholder="새 암호" autocomplete="off">
      <div class="row-flex" style="flex-direction:column;">
        <input type="text" id="pwModalConfirm" placeholder="새 암호 확인" autocomplete="off">
      </div>
    </div>
    <div id="pwModalMsg"></div>
    <div class="row-flex">
      <button class="btn-gray-full" id="pwModalCancelBtn" style="margin-top:12px;">취소</button>
      <button class="primary" id="pwModalConfirmBtn" style="width:100%; margin-top:12px;">변경하기</button>
    </div>
  </div>
</div>

<script>
// ---- 버튼 중복 클릭 방지 ----
// (시간이 지나면 자동으로 풀리는 방식이 아니라, 실제 다음 화면/동작이 일어날 때까지
//  확실하게 비활성 상태를 유지하도록 각 버튼에서 직접 제어합니다.)

// Apps Script 웹앱 배포 URL (doPost가 JSON API 역할을 함)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyoE90HietTg4sG3ODW5bSgG0D_PPj1Zxn3ShOVYfVDEhwGOIqYJRfsP5WFb3B3mD2A/exec';
// 녹음 페이지 (같은 저장소, GitHub Pages)
const RECORDER_PAGE_URL = 'recorder.html';

function callApi(action, payload) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS 프리플라이트 회피
    body: JSON.stringify({ action: action, payload: payload || {} })
  }).then(res => res.json());
}

let currentStudentId = '', currentStudentName = '', currentClassId = '', currentClassName = '';
let hasCelebrated = false; // 이번 로그인 동안 완료 축하 효과를 이미 보여줬는지

const gradeInfo = {
  'Good':     { icon: '😃', text: '참 잘 읽었어요' },
  'Normal':   { icon: '🙂', text: '잘 읽었어요' },
  'Practice': { icon: '🤔', text: '다시 한번 읽어볼까요' }
};
const numIcon = { 1: '1️⃣', 2: '2️⃣', 3: '3️⃣' };
function scoreLabel(a) {
  return (a.score === null || a.score === undefined) ? '' : (a.score + '점 · ');
}
// ---- 축하 컨페티(색종이) 효과 ----
function launchConfetti() {
  const colors = ['#4C6FFF', '#14B8A6', '#F59E0B', '#8B93A7', '#3853D6'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:2000; overflow:hidden;';
  document.body.appendChild(container);
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = 6 + Math.random() * 6;
    const left = Math.random() * 100;
    const duration = 1.8 + Math.random() * 1.4;
    const delay = Math.random() * 0.4;
    const rotate = Math.random() * 360;
    const shape = Math.random() > 0.5 ? '50%' : '3px';
    piece.style.cssText = `position:absolute; top:-20px; left:${left}%; width:${size}px; height:${size}px;
      background:${color}; border-radius:${shape};
      animation: confettiFall ${duration}s ease-in ${delay}s forwards; transform:rotate(${rotate}deg);`;
    container.appendChild(piece);
  }
  setTimeout(() => container.remove(), 3600);
}

// 화면(카드)을 보여줄 때 통통 튀는 등장 애니메이션을 매번 새로 재생
function showCard(el) {
  el.style.display = 'block';
  el.classList.remove('pop-in');
  void el.offsetWidth; // reflow로 애니메이션 재시작
  el.classList.add('pop-in');
}

function setBtnBusy(btn, busyText) {
  if (!btn) return;
  if (!btn.dataset.origText) btn.dataset.origText = btn.textContent;
  btn.disabled = true;
  btn.style.opacity = '0.55';
  btn.style.cursor = 'wait';
  if (busyText) btn.textContent = busyText;
}
function resetBtn(btn) {
  if (!btn) return;
  btn.disabled = false;
  btn.style.opacity = '';
  btn.style.cursor = '';
  if (btn.dataset.origText) btn.textContent = btn.dataset.origText;
}
// resetBtn과 달리 다시 눌러지게 만들진 않고, 원래 글자만 되돌리면서 비활성 상태는 유지한다.
// (다음 단계로 넘어가서 이 버튼을 또 누를 필요가 없을 때, "확인 중..." 같은 문구만 없애고 싶을 때 씀)
function disableBtnKeepLabel(btn) {
  if (!btn) return;
  btn.disabled = true;
  btn.style.opacity = '0.55';
  btn.style.cursor = 'not-allowed';
  if (btn.dataset.origText) btn.textContent = btn.dataset.origText;
}

// ---- 녹음 페이지로부터 완료/취소 신호 수신 ----
// 녹음을 마쳤을 때(readingHwRecordingComplete)뿐 아니라, 녹음 없이 "이전 화면으로"를 눌러
// 돌아왔을 때(readingHwRecordingCancelled)도 즉시 처리한다. focus 이벤트만 믿으면 일부
// 모바일 브라우저에서 몇 분씩 늦게 오거나 아예 안 와서, "다시 녹음하러 가기" 버튼이
// 계속 비활성 상태로 남는 문제가 있었기 때문.
window.addEventListener('message', (event) => {
  const type = event.data && event.data.type;
  if (type === 'readingHwRecordingComplete' || type === 'readingHwRecordingCancelled') {
    document.getElementById('waitingBanner').innerHTML = '';
    reloadHomework();
  }
});

// ---- 로그인 ----
const nameInput = document.getElementById('nameInput');
const goBtn = document.getElementById('goBtn');
const loginMsg = document.getElementById('loginMsg');
const classChoiceArea = document.getElementById('classChoiceArea');
const passwordArea = document.getElementById('passwordArea');
const passwordInput = document.getElementById('passwordInput');
const pwMsg = document.getElementById('pwMsg');
let pendingLogin = null; // 암호 확인 중인 학생 { studentId, name, classId }

goBtn.addEventListener('click', () => {
  const name = nameInput.value.trim();
  if (!name) return;
  setBtnBusy(goBtn, '확인 중...');
  classChoiceArea.style.display = 'none';
  passwordArea.style.display = 'none';
  loginMsg.innerHTML = '<div class="msg info">숙제 화면으로 이동 중...</div>';

  callApi('findStudentMatches', { name: name })
    .then(res => {
      const matches = res.matches || [];
      if (matches.length === 0) {
        resetBtn(goBtn);
        loginMsg.innerHTML = '<div class="msg error">등록되지 않은 이름입니다. 선생님께 확인해주세요.</div>';
      } else if (matches.length === 1) {
        proceedAfterMatch(matches[0], name);
      } else {
        resetBtn(goBtn);
        loginMsg.innerHTML = '';
        document.getElementById('dupMsg').textContent =
          `'${name}' 학생이 여러 반에 있습니다. 반을 선택해주세요.`;
        const radios = document.getElementById('classRadios');
        radios.innerHTML = '';
        matches.forEach((m, idx) => {
          const div = document.createElement('label');
          div.className = 'radio-item';
          div.innerHTML = `<input type="radio" name="classChoice" value="${idx}" ${idx===0?'checked':''}> ${m.className}`;
          radios.appendChild(div);
        });
        classChoiceArea.style.display = 'block';
        classChoiceArea.dataset.matches = JSON.stringify(matches);
        classChoiceArea.dataset.name = name;
      }
    })
    .catch(() => {
      resetBtn(goBtn);
      loginMsg.innerHTML = '<div class="msg error">오류가 발생했습니다. 다시 시도해주세요.</div>';
    });
});

const confirmClassBtn = document.getElementById('confirmClassBtn');
confirmClassBtn.addEventListener('click', () => {
  const matches = JSON.parse(classChoiceArea.dataset.matches);
  const name = classChoiceArea.dataset.name;
  const idx = Number(document.querySelector('input[name=classChoice]:checked').value);
  setBtnBusy(confirmClassBtn, '확인 중...');
  setBtnBusy(goBtn);
  loginMsg.innerHTML = '<div class="msg info">숙제 화면으로 이동 중...</div>';
  proceedAfterMatch(matches[idx], name);
});

// 이름(+반) 확인이 끝난 뒤: 그 반이 암호를 쓰면 암호 입력 단계로, 아니면 바로 숙제 화면으로
function proceedAfterMatch(match, name) {
  if (!match.passwordEnabled) {
    enterHomework(match.studentId, name, match.classId, false);
    return;
  }
  pendingLogin = { studentId: match.studentId, name: name, classId: match.classId };
  // 암호 입력 단계로 넘어간 뒤에는 "숙제하기로 이동"을 다시 누를 필요가 없고, 눌러지면
  // 학생이 헷갈릴 수 있어서 계속 비활성 상태로 둔다 (글자만 원래대로 되돌림).
  disableBtnKeepLabel(goBtn);
  disableBtnKeepLabel(confirmClassBtn);
  loginMsg.innerHTML = '';
  classChoiceArea.style.display = 'none';
  pwMsg.className = 'msg info';
  pwMsg.textContent = '암호를 입력해주세요. (처음이면 1111)';
  passwordInput.value = '1111';
  passwordArea.style.display = 'block';
  passwordInput.focus();
  passwordInput.select();
}

const confirmPasswordBtn = document.getElementById('confirmPasswordBtn');
confirmPasswordBtn.addEventListener('click', submitPassword);
passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPassword(); });

function submitPassword() {
  const pw = passwordInput.value;
  if (!pw || !pendingLogin) return;
  setBtnBusy(confirmPasswordBtn, '확인 중...');
  callApi('verifyStudentPassword', { studentId: pendingLogin.studentId, password: pw })
    .then(res => {
      if (!res.success) {
        resetBtn(confirmPasswordBtn);
        pwMsg.className = 'msg error';
        pwMsg.textContent = res.message || '암호가 틀렸습니다. 다시 입력해주세요.';
        return;
      }
      // 암호 확인 후 다음 화면(getHomeworkScreen)을 불러오는 동안 화면이 갑자기 텅 비어 보이면
      // 학생이 당황할 수 있어서, 입력창/버튼을 바로 감추지 않고 "이동 중" 상태를 계속 보여준다.
      pwMsg.className = 'msg info';
      pwMsg.textContent = '✅ 확인됐어요!';
      setBtnBusy(confirmPasswordBtn, '이동 중...');
      loginMsg.innerHTML = '<div class="msg info">숙제 화면으로 이동 중...</div>';
      const login = pendingLogin;
      pendingLogin = null;
      enterHomework(login.studentId, login.name, login.classId, true);
    })
    .catch(() => {
      resetBtn(confirmPasswordBtn);
      pwMsg.className = 'msg error';
      pwMsg.textContent = '오류가 발생했습니다. 다시 시도해주세요.';
    });
}

function enterHomework(studentId, studentName, classId, passwordEnabled) {
  currentStudentId = studentId;
  currentStudentName = studentName;
  currentClassId = classId;
  document.getElementById('pwChangeBtn').style.display = passwordEnabled ? '' : 'none';
  callApi('getHomeworkScreen', { studentId: studentId })
    .then(res => {
      if (res.error) {
        loginMsg.innerHTML = '<div class="msg error">' + res.error + '</div>';
        resetBtn(goBtn);
        resetBtn(confirmClassBtn);
        resetBtn(confirmPasswordBtn);
        return;
      }
      if (res.noAssignment) {
        loginMsg.innerHTML = '<div class="msg info">' + res.className + ' - 아직 등록된 과제가 없어요. 선생님께 확인해주세요.</div>';
        resetBtn(goBtn);
        resetBtn(confirmClassBtn);
        resetBtn(confirmPasswordBtn);
        return;
      }
      currentClassName = res.className;
      resetBtn(goBtn);
      resetBtn(confirmClassBtn);
      resetBtn(confirmPasswordBtn);
      document.getElementById('loginCard').style.display = 'none';
      showCard(document.getElementById('homeworkCard'));
      hasCelebrated = false;
      document.getElementById('classBadge').textContent = res.className;
      document.getElementById('studentNameBig').textContent = currentStudentName;
      applyHomeworkData(res);
    })
    .catch(() => {
      loginMsg.innerHTML = '<div class="msg error">오류가 발생했습니다. 다시 시도해주세요.</div>';
      resetBtn(goBtn);
      resetBtn(confirmClassBtn);
      resetBtn(confirmPasswordBtn);
    });
}

function isFullyDone(attempts) {
  const set = new Set(attempts.map(a => a.attempt));
  return set.has(1) && set.has(2) && set.has(3);
}

function applyHomeworkData(res) {
  document.getElementById('assignmentTitleLabel').textContent = res.assignmentTitle;
  document.getElementById('scriptText').textContent = res.script;
  window.currentAssignmentId = res.assignmentId;
  window.currentAssignmentTitle = res.assignmentTitle;
  window.currentScript = res.script;
  renderAttemptsInto('attemptsArea', res.attempts, false);

  const retryBlock = document.getElementById('retryAssignmentBlock');
  let retryDone = true;
  if (res.retryAssignment) {
    retryBlock.style.display = 'block';
    document.getElementById('retryAssignmentTitleLabel').textContent = res.retryAssignment.assignmentTitle;
    document.getElementById('retryScriptText').textContent = res.retryAssignment.script;
    window.retryAssignmentId = res.retryAssignment.assignmentId;
    window.retryAssignmentTitle = res.retryAssignment.assignmentTitle;
    window.retryScript = res.retryAssignment.script;
    renderAttemptsInto('retryAttemptsArea', res.retryAssignment.attempts, true);
    retryDone = isFullyDone(res.retryAssignment.attempts);
  } else {
    retryBlock.style.display = 'none';
  }

  const mainDone = isFullyDone(res.attempts);
  const allDoneArea = document.getElementById('allDoneArea');
  if (mainDone && retryDone) {
    const allAttempts = res.attempts.concat(res.retryAssignment ? res.retryAssignment.attempts : []);
    const hasPractice = allAttempts.some(a => a.grade === 'Practice');
    const bannerHtml = hasPractice
      ? '<div class="done-banner" style="margin-top:20px; background:#FFF7E8; border-left-color:var(--amber);">💪 연습해서 다시 한번 녹음해봐요!</div>'
      : '<div class="done-banner" style="margin-top:20px;">🎉 오늘 숙제를 모두 마쳤어요! 수고했어요.</div>';
    allDoneArea.innerHTML = bannerHtml +
      '<button class="primary" id="goToLoginBtn" style="width:100%; margin-top:12px;">🏠 처음 화면으로 이동</button>';
    document.getElementById('goToLoginBtn').addEventListener('click', goToLoginScreen);
    if (!hasPractice && !hasCelebrated) {
      hasCelebrated = true;
      launchConfetti();
    }
  } else {
    allDoneArea.innerHTML = '';
  }
}

function goToLoginScreen() {
  document.getElementById('homeworkCard').style.display = 'none';
  document.getElementById('historyCard').style.display = 'none';
  showCard(document.getElementById('loginCard'));
  document.getElementById('nameInput').value = '';
  document.getElementById('loginMsg').innerHTML = '';
  document.getElementById('classChoiceArea').style.display = 'none';
  document.getElementById('passwordArea').style.display = 'none';
  resetBtn(goBtn);
  resetBtn(confirmClassBtn);
  resetBtn(confirmPasswordBtn);
  pendingLogin = null;
  hasCelebrated = false;
  currentStudentId = ''; currentStudentName = ''; currentClassId = ''; currentClassName = '';
}

// ---- 숙제 화면: 시도 카드 렌더링 (일반/다시읽기 공용) ----
function renderAttemptsInto(containerId, attempts, isRetry) {
  const attemptsArea = document.getElementById(containerId);
  attemptsArea.innerHTML = '';

  const doneMap = {};
  attempts.forEach(a => { doneMap[a.attempt] = a; });
  const allDone = doneMap[1] && doneMap[2] && doneMap[3];
  const label = isRetry ? '번째 다시읽기' : '번째 읽기';

  for (let n = 1; n <= 3; n++) {
    const info = doneMap[n];
    const unlocked = (n === 1) || !!doneMap[n - 1];
    const row = document.createElement('div');
    row.className = 'attempt' + (!info && !unlocked ? ' locked' : '');

    // 제출된 시도는 녹음 파일(driveFileId)이 있으면 "▶ 다시듣기" 버튼을 재녹음 버튼 옆에 나란히 붙인다.
    // 카드 자체의 높이/구성은 접힌 상태(기본값)에서는 기존과 동일하게 유지되고, 눌렀을 때만
    // status-txt 아래에 오디오 플레이어가 펼쳐진다 (선생님 관리 화면의 "녹음듣기"와 같은 방식).
    const playBtnHtml = (info && info.driveFileId)
      ? `<button class="btn-play" onclick="toggleAudio(this,'${info.driveFileId}')">▶ 다시듣기</button>`
      : '';

    let statusHtml, redoBtnHtml;
    if (!info) {
      if (unlocked) {
        statusHtml = '아직 제출하지 않음';
        redoBtnHtml = `<button class="btn-go" onclick="openRecorder(this, ${n}, ${isRetry})">🎙️ 녹음하러 가기</button>`;
      } else {
        statusHtml = '이전 읽기를 먼저 완료해주세요';
        redoBtnHtml = `<button class="btn-locked" disabled>🔒 잠김</button>`;
      }
    } else if (info.grade && gradeInfo[info.grade]) {
      statusHtml = `✅ 제출 완료! ${scoreLabel(info)}${gradeInfo[info.grade].icon} ${gradeInfo[info.grade].text}` +
                   (info.comment ? `<br>💬 선생님: ${info.comment}` : '');
      redoBtnHtml = `<button class="btn-redo" onclick="openRecorder(this, ${n}, ${isRetry})">🔄 다시 녹음하러 가기</button>`;
    } else if (info.retryPending) {
      statusHtml = '✅ 제출 완료! 나중에 등급이 확인되면 표시돼요 (제출은 잘 완료됐어요)';
      redoBtnHtml = `<button class="btn-redo" onclick="openRecorder(this, ${n}, ${isRetry})">🔄 다시 녹음하러 가기</button>`;
    } else {
      statusHtml = '✅ 제출 완료! 등급 확인 실패 (제출은 잘 완료됐어요)';
      redoBtnHtml = `<button class="btn-redo" onclick="openRecorder(this, ${n}, ${isRetry})">🔄 다시 녹음하러 가기</button>`;
    }

    row.innerHTML = `
      <div class="attempt-top">
        <div class="attempt-label">${numIcon[n]} ${n}${label}</div>
        <div class="attempt-actions">${playBtnHtml}${redoBtnHtml}</div>
      </div>
      <div class="status-txt">${statusHtml}</div>
      <div class="audio-holder" style="display:none;"></div>
    `;
    attemptsArea.appendChild(row);
  }

  if (allDone && isRetry) {
    const banner = document.createElement('div');
    banner.className = 'done-banner';
    banner.textContent = '✅ 다시읽기 완료!';
    attemptsArea.appendChild(banner);
  }
}

function openRecorder(btn, attemptNum, isRetry) {
  setBtnBusy(btn, '🎙️ 녹음 창으로 이동...');
  const assignmentId = isRetry ? window.retryAssignmentId : window.currentAssignmentId;
  const assignmentTitle = isRetry ? window.retryAssignmentTitle : window.currentAssignmentTitle;
  const script = isRetry ? window.retryScript : window.currentScript;

  const params = new URLSearchParams({
    studentId: currentStudentId,
    studentName: currentStudentName,
    className: currentClassName,
    classId: currentClassId,
    assignmentId: assignmentId,
    assignmentTitle: assignmentTitle,
    attempt: attemptNum,
    script: script,
    isRetry: isRetry ? '1' : '0'
  });
  const url = RECORDER_PAGE_URL + '?' + params.toString();
  window.open(url, '_blank');
  document.getElementById('waitingBanner').innerHTML =
    '<div class="waiting-banner">🎙️ 새 창에서 녹음을 진행해주세요. 녹음을 마치면 이 화면이 자동으로 업데이트돼요.</div>';
}

// ---- 제출한 녹음 다시듣기 (선생님 관리 화면의 "녹음 듣기"와 같은 방식: 한 번 불러오면
// 다시 서버에 요청하지 않고 보이기/접기만 토글) ----
function toggleAudio(btn, driveFileId) {
  const holder = btn.closest('.attempt').querySelector('.audio-holder');

  if (holder.dataset.loaded === '1') {
    const isShown = holder.style.display !== 'none';
    if (isShown) {
      const audioEl = holder.querySelector('audio');
      if (audioEl) audioEl.pause();
      holder.style.display = 'none';
      btn.textContent = '▶ 다시듣기';
    } else {
      holder.style.display = 'block';
      btn.textContent = '🔽 접기';
    }
    return;
  }

  setBtnBusy(btn, '불러오는 중...');
  callApi('getRecordingAudio', { studentId: currentStudentId, driveFileId: driveFileId })
    .then(res => {
      resetBtn(btn);
      if (!res.success) {
        alert(res.message || '녹음을 불러오지 못했어요.');
        return;
      }
      holder.innerHTML = `<audio controls src="data:${res.mimeType};base64,${res.base64}"></audio>`;
      holder.dataset.loaded = '1';
      holder.style.display = 'block';
      btn.textContent = '🔽 접기';
    })
    .catch(() => {
      resetBtn(btn);
      alert('오류가 발생했습니다. 다시 시도해주세요.');
    });
}

// 녹음 창(새 탭)에서 다시 이 화면으로 돌아오면(탭 전환/창 닫기 등) 자동으로 최신 상태를 다시 불러옵니다.
// postMessage를 놓치거나, 학생이 녹음을 끝내지 않고 그냥 돌아온 경우(예: 브라우저/폰의
// 뒤로가기로 녹음 창을 나온 경우)에도 버튼이 계속 눌린 채로 남지 않도록 focus뿐 아니라
// visibilitychange도 같이 감시한다 — 일부 모바일 브라우저는 background 탭에서 focus를
// 늦게 보내거나 아예 보내지 않는데, visibilitychange는 더 안정적으로 온다.
function maybeReloadHomeworkOnReturn() {
  if (currentStudentId && document.getElementById('homeworkCard').style.display !== 'none') {
    reloadHomework();
  }
}
window.addEventListener('focus', maybeReloadHomeworkOnReturn);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') maybeReloadHomeworkOnReturn();
});

let reloadHomeworkInFlight = false; // message/focus/visibilitychange가 거의 동시에 겹쳐 불려도 중복 호출 방지
function reloadHomework() {
  if (reloadHomeworkInFlight) return;
  reloadHomeworkInFlight = true;
  callApi('getHomeworkScreen', { studentId: currentStudentId }).then(res => {
    reloadHomeworkInFlight = false;
    if (res.error || res.noAssignment) return;
    applyHomeworkData(res);
  }).catch(() => { reloadHomeworkInFlight = false; });
}

// ---- 지난 숙제 기록 ----
document.getElementById('historyLinkBtn').addEventListener('click', () => {
  document.getElementById('homeworkCard').style.display = 'none';
  showCard(document.getElementById('historyCard'));
  document.getElementById('historyList').innerHTML = '<p class="hint">불러오는 중...</p>';
  callApi('getStudentHistory', { studentId: currentStudentId }).then(res => renderHistory(res.list || []));
});

// ---- 암호 변경 ----
// (브라우저 기본 prompt()/alert()는 상단에 "oosoos7925.github.io 내용:" 같은 주소가 그대로
//  노출돼서, 대신 카드 스타일과 맞춘 자체 모달을 씀)
const pwModalOverlay = document.getElementById('pwModalOverlay');
const pwModalFields = document.getElementById('pwModalFields');
const pwModalNew = document.getElementById('pwModalNew');
const pwModalConfirm = document.getElementById('pwModalConfirm');
const pwModalMsg = document.getElementById('pwModalMsg');
const pwModalCancelBtn = document.getElementById('pwModalCancelBtn');
const pwModalConfirmBtn = document.getElementById('pwModalConfirmBtn');

function openPwModal() {
  pwModalNew.value = '';
  pwModalConfirm.value = '';
  pwModalMsg.innerHTML = '';
  pwModalFields.style.display = '';
  pwModalConfirmBtn.style.display = '';
  pwModalCancelBtn.textContent = '취소';
  pwModalOverlay.classList.add('open');
  pwModalNew.focus();
}

document.getElementById('pwChangeBtn').addEventListener('click', openPwModal);

pwModalCancelBtn.addEventListener('click', () => {
  pwModalOverlay.classList.remove('open');
});

pwModalConfirmBtn.addEventListener('click', () => {
  const trimmed = pwModalNew.value.trim();
  const confirmTrimmed = pwModalConfirm.value.trim();
  if (!trimmed) { pwModalMsg.innerHTML = '<div class="msg error">암호를 입력해주세요.</div>'; return; }
  if (confirmTrimmed !== trimmed) {
    pwModalMsg.innerHTML = '<div class="msg error">입력하신 두 암호가 서로 달라요. 다시 확인해주세요.</div>';
    return;
  }

  setBtnBusy(pwModalConfirmBtn, '변경 중...');
  callApi('changeStudentPassword', { studentId: currentStudentId, password: trimmed })
    .then(res => {
      resetBtn(pwModalConfirmBtn);
      if (res.success) {
        pwModalFields.style.display = 'none';
        pwModalConfirmBtn.style.display = 'none';
        pwModalCancelBtn.textContent = '닫기';
        pwModalMsg.innerHTML = '<div class="msg info" style="background:#EAFBF6; border-left-color:var(--teal);">✅ 암호가 변경됐어요!</div>';
      } else {
        pwModalMsg.innerHTML = '<div class="msg error">' + (res.message || '암호 변경에 실패했어요.') + '</div>';
      }
    })
    .catch(() => {
      resetBtn(pwModalConfirmBtn);
      pwModalMsg.innerHTML = '<div class="msg error">오류가 발생했습니다. 다시 시도해주세요.</div>';
    });
});

pwModalConfirm.addEventListener('keydown', (e) => { if (e.key === 'Enter') pwModalConfirmBtn.click(); });

document.getElementById('backFromHistoryBtn').addEventListener('click', () => {
  document.getElementById('historyCard').style.display = 'none';
  showCard(document.getElementById('homeworkCard'));
});

function renderHistory(list) {
  const el = document.getElementById('historyList');
  if (!list.length) {
    el.innerHTML = '<p class="hint">아직 제출한 숙제가 없어요.</p>';
    return;
  }
  el.innerHTML = '';
  list.forEach(asg => {
    const div = document.createElement('div');
    div.className = 'history-item';
    let attemptsHtml = '';
    asg.attempts.forEach(a => {
      const gradeText = a.grade && gradeInfo[a.grade]
        ? `${scoreLabel(a)}${gradeInfo[a.grade].icon} ${gradeInfo[a.grade].text}`
        : (a.retryPending ? '분석 대기 중' : '등급 확인 실패');
      attemptsHtml += `<div class="history-attempt">${a.attempt}번째 읽기 (${a.timestamp}) - ${gradeText}` +
        (a.comment ? `<br>💬 선생님: ${a.comment}` : '') + `</div>`;
    });
    div.innerHTML = `<h3>${asg.assignmentTitle}</h3>${attemptsHtml}`;
    el.appendChild(div);
  });
}
</script>
